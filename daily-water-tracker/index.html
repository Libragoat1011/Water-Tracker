<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日喝水紀錄器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="header">
        <div>
          <p class="eyebrow">DAILY WATER TRACKER</p>
          <h1>每日喝水紀錄器</h1>
          <p class="subtitle">簡單記錄今天喝了多少水</p>
        </div>
        <div class="water-icon" aria-hidden="true">💧</div>
      </div>

      <div class="amount-area">
        <div id="currentAmount" class="current-amount">0</div>
        <div class="unit">ml</div>
        <div id="targetText" class="target-text">0 / 2000 ml</div>
      </div>

      <div class="progress-section">
        <div class="progress-track" aria-label="每日飲水進度">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="progress-meta">
          <span>每日目標</span>
          <strong id="progressPercent">0%</strong>
        </div>
      </div>

      <div id="successMessage" class="success-message" role="status" aria-live="polite">
        <!-- 成功提示由 JavaScript 控制 -->
      </div>

      <div class="controls">
        <button id="minusBtn" class="btn secondary" type="button">−250 ml</button>
        <button id="plusBtn" class="btn primary" type="button">＋250 ml</button>
      </div>

      <button id="resetBtn" class="reset-btn" type="button">重置今日紀錄</button>

      <p id="storageStatus" class="storage-status">資料會自動儲存在此瀏覽器</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
