<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日喝水紀錄器 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>每日喝水紀錄器</h1>
      <p class="subtitle">今天喝了多少水？</p>

      <div class="amount">
        <strong id="amount">0</strong>
        <span>ml</span>
      </div>

      <p id="target">0 / 2000 ml</p>

      <div class="progress">
        <div id="bar"></div>
      </div>

      <p id="message" class="message"></p>

      <div class="buttons">
        <button id="minus">−250 ml</button>
        <button id="plus">＋250 ml</button>
      </div>

      <button id="reset" class="reset">重置</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
